<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Yonex Astrox 88 badminton racket illustration">
  <rect width="200" height="200" fill="#f0f4ff" rx="16"/>
  <!-- Racket head (oval) -->
  <ellipse cx="100" cy="70" rx="38" ry="48" fill="none" stroke="#6366f1" stroke-width="5"/>
  <!-- String grid horizontal -->
  <line x1="66" y1="55" x2="134" y2="55" stroke="#a5b4fc" stroke-width="1.5"/>
  <line x1="63" y1="65" x2="137" y2="65" stroke="#a5b4fc" stroke-width="1.5"/>
  <line x1="63" y1="75" x2="137" y2="75" stroke="#a5b4fc" stroke-width="1.5"/>
  <line x1="66" y1="85" x2="134" y2="85" stroke="#a5b4fc" stroke-width="1.5"/>
  <!-- String grid vertical -->
  <line x1="80" y1="24" x2="80" y2="116" stroke="#a5b4fc" stroke-width="1.5"/>
  <line x1="90" y1="22" x2="90" y2="118" stroke="#a5b4fc" stroke-width="1.5"/>
  <line x1="100" y1="22" x2="100" y2="118" stroke="#a5b4fc" stroke-width="1.5"/>
  <line x1="110" y1="22" x2="110" y2="118" stroke="#a5b4fc" stroke-width="1.5"/>
  <line x1="120" y1="24" x2="120" y2="116" stroke="#a5b4fc" stroke-width="1.5"/>
  <!-- Shaft -->
  <rect x="96" y="118" width="8" height="32" fill="#4f46e5" rx="3"/>
  <!-- Handle -->
  <rect x="90" y="148" width="20" height="36" fill="#1e1b4b" rx="5"/>
  <!-- Brand mark -->
  <text x="100" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4f46e5">YNX</text>
  <text x="100" y="186" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6366f1">Astrox 88</text>
</svg>
