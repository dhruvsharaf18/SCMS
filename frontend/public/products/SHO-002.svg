<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Yonex Power Cushion badminton shoe illustration">
  <rect width="200" height="200" fill="#fdf4ff" rx="16"/>
  <!-- Sole -->
  <ellipse cx="105" cy="158" rx="62" ry="14" fill="#4c1d95"/>
  <!-- Midsole -->
  <rect x="45" y="140" width="120" height="20" fill="#7c3aed" rx="4"/>
  <!-- Upper -->
  <path d="M 48 142 Q 55 100 80 90 Q 110 82 145 100 L 165 120 Q 150 136 130 142 Z" fill="white" stroke="#7c3aed" stroke-width="2"/>
  <!-- Toe box -->
  <ellipse cx="155" cy="130" rx="18" ry="14" fill="white" stroke="#7c3aed" stroke-width="2"/>
  <!-- Laces -->
  <line x1="85" y1="105" x2="125" y2="105" stroke="#5b21b6" stroke-width="2"/>
  <line x1="88" y1="112" x2="128" y2="112" stroke="#5b21b6" stroke-width="2"/>
  <line x1="91" y1="119" x2="131" y2="119" stroke="#5b21b6" stroke-width="2"/>
  <!-- Tongue -->
  <path d="M 92 100 Q 100 88 108 100" fill="#7c3aed" stroke="#5b21b6" stroke-width="1"/>
  <!-- Heel -->
  <rect x="44" y="108" width="20" height="34" fill="#3b0764" rx="4"/>
  <text x="68" y="135" font-family="sans-serif" font-size="7" font-weight="bold" fill="#7c3aed">POWER</text>
  <text x="100" y="185" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7c3aed">Power Cushion</text>
</svg>
