<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Racket bag illustration">
  <rect width="200" height="200" fill="#f0f4ff" rx="16"/>
  <!-- Bag body -->
  <rect x="40" y="55" width="120" height="110" fill="#6366f1" rx="12"/>
  <!-- Bag front pocket -->
  <rect x="50" y="80" width="100" height="60" fill="#4f46e5" rx="8"/>
  <!-- Zipper line -->
  <line x1="50" y1="80" x2="150" y2="80" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="100" cy="80" r="4" fill="#c7d2fe"/>
  <!-- Racket silhouette inside -->
  <ellipse cx="80" cy="110" rx="12" ry="15" fill="none" stroke="#a5b4fc" stroke-width="2"/>
  <rect x="78" y="125" width="4" height="14" fill="#a5b4fc"/>
  <ellipse cx="130" cy="110" rx="12" ry="15" fill="none" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="128" y="125" width="4" height="14" fill="#c7d2fe"/>
  <!-- Shoulder strap -->
  <path d="M 55 55 Q 50 30 40 25 Q 30 20 35 30 Q 40 40 45 55" fill="none" stroke="#818cf8" stroke-width="5" stroke-linecap="round"/>
  <!-- Bag label -->
  <text x="100" y="75" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#c7d2fe">6 RACKETS</text>
  <!-- Top handle -->
  <path d="M 80 55 Q 100 42 120 55" fill="none" stroke="#818cf8" stroke-width="5" stroke-linecap="round"/>
  <text x="100" y="185" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6366f1">Racket Bag</text>
</svg>
