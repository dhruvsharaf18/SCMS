<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Club shorts illustration">
  <rect width="200" height="200" fill="#eff6ff" rx="16"/>
  <!-- Waistband -->
  <rect x="45" y="48" width="110" height="20" fill="#1d4ed8" rx="4"/>
  <!-- Elastic detail -->
  <line x1="45" y1="57" x2="155" y2="57" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <!-- Drawstring -->
  <line x1="88" y1="48" x2="85" y2="38" stroke="#93c5fd" stroke-width="2"/>
  <line x1="112" y1="48" x2="115" y2="38" stroke="#93c5fd" stroke-width="2"/>
  <!-- Left leg -->
  <path d="M 45 68 L 45 145 Q 50 155 65 155 L 90 155 L 100 68 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
  <!-- Right leg -->
  <path d="M 155 68 L 155 145 Q 150 155 135 155 L 110 155 L 100 68 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
  <!-- Side stripe -->
  <line x1="48" y1="68" x2="52" y2="148" stroke="#93c5fd" stroke-width="2"/>
  <line x1="152" y1="68" x2="148" y2="148" stroke="#93c5fd" stroke-width="2"/>
  <!-- CC Badge -->
  <text x="100" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">CC</text>
  <text x="100" y="185" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#2563eb">Club Shorts</text>
</svg>
