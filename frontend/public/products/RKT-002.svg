<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Wilson Pro Staff tennis racket illustration">
  <rect width="200" height="200" fill="#f0fdf4" rx="16"/>
  <!-- Racket head (larger oval for tennis) -->
  <ellipse cx="100" cy="72" rx="44" ry="55" fill="none" stroke="#16a34a" stroke-width="5"/>
  <!-- String grid horizontal -->
  <line x1="62" y1="52" x2="138" y2="52" stroke="#86efac" stroke-width="1.5"/>
  <line x1="59" y1="63" x2="141" y2="63" stroke="#86efac" stroke-width="1.5"/>
  <line x1="58" y1="74" x2="142" y2="74" stroke="#86efac" stroke-width="1.5"/>
  <line x1="59" y1="85" x2="141" y2="85" stroke="#86efac" stroke-width="1.5"/>
  <line x1="62" y1="96" x2="138" y2="96" stroke="#86efac" stroke-width="1.5"/>
  <!-- String grid vertical -->
  <line x1="78" y1="20" x2="78" y2="124" stroke="#86efac" stroke-width="1.5"/>
  <line x1="88" y1="18" x2="88" y2="126" stroke="#86efac" stroke-width="1.5"/>
  <line x1="98" y1="17" x2="98" y2="127" stroke="#86efac" stroke-width="1.5"/>
  <line x1="108" y1="17" x2="108" y2="127" stroke="#86efac" stroke-width="1.5"/>
  <line x1="118" y1="18" x2="118" y2="126" stroke="#86efac" stroke-width="1.5"/>
  <line x1="128" y1="20" x2="128" y2="124" stroke="#86efac" stroke-width="1.5"/>
  <!-- Shaft -->
  <rect x="96" y="127" width="8" height="28" fill="#15803d" rx="3"/>
  <!-- Handle grip -->
  <rect x="89" y="153" width="22" height="34" fill="#14532d" rx="5"/>
  <!-- Brand mark -->
  <text x="100" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a">WLS</text>
  <text x="100" y="188" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#16a34a">Pro Staff</text>
</svg>
