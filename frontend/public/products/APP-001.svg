<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Club polo shirt illustration">
  <rect width="200" height="200" fill="#f0fdf4" rx="16"/>
  <!-- Shirt body -->
  <path d="M 55 75 L 40 100 L 55 108 L 60 80 L 60 165 L 140 165 L 140 80 L 145 108 L 160 100 L 145 75 Q 130 65 120 60 L 115 70 Q 110 78 100 80 Q 90 78 85 70 L 80 60 Q 70 65 55 75 Z" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <!-- Collar -->
  <path d="M 85 70 Q 100 85 115 70 L 115 62 Q 110 68 100 70 Q 90 68 85 62 Z" fill="#166534" stroke="#14532d" stroke-width="1"/>
  <!-- Placket buttons -->
  <circle cx="100" cy="95" r="2.5" fill="white"/>
  <circle cx="100" cy="108" r="2.5" fill="white"/>
  <circle cx="100" cy="121" r="2.5" fill="white"/>
  <!-- Club badge -->
  <rect x="110" y="95" width="20" height="16" fill="#14532d" rx="3"/>
  <text x="120" y="107" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#4ade80">CC</text>
  <!-- Sleeve seam lines -->
  <line x1="60" y1="80" x2="55" y2="108" stroke="#15803d" stroke-width="1"/>
  <line x1="140" y1="80" x2="145" y2="108" stroke="#15803d" stroke-width="1"/>
  <text x="100" y="185" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#16a34a">Club Polo Shirt</text>
</svg>
