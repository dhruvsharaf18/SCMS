<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Tennis balls can illustration">
  <rect width="200" height="200" fill="#fefce8" rx="16"/>
  <!-- Can body -->
  <rect x="72" y="50" width="56" height="110" fill="#d4d4d4" rx="8"/>
  <rect x="74" y="52" width="52" height="106" fill="#e5e7eb" rx="6"/>
  <!-- Label -->
  <rect x="72" y="85" width="56" height="40" fill="#facc15"/>
  <text x="100" y="100" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1a1a1a">TENNIS</text>
  <text x="100" y="112" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#1a1a1a">BALLS × 3</text>
  <!-- Ball visible through can -->
  <circle cx="100" cy="65" r="16" fill="#84cc16" stroke="#4d7c0f" stroke-width="1.5"/>
  <!-- Ball seam -->
  <path d="M 88 63 Q 100 72 112 63" fill="none" stroke="white" stroke-width="1.5"/>
  <path d="M 88 67 Q 100 58 112 67" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Can top/bottom -->
  <ellipse cx="100" cy="50" rx="28" ry="5" fill="#9ca3af"/>
  <ellipse cx="100" cy="160" rx="28" ry="5" fill="#9ca3af"/>
  <text x="100" y="185" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ca8a04">Can of 3</text>
</svg>
